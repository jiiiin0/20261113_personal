<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="판타지 소설 작가 별하늘의 공식 홈페이지"><title>방명록 | 별하늘의 서재</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container" style="display:flex;align-items:center;justify-content:space-between;width:min(1120px,calc(100% - 44px))"><a class="brand" href="index.html">✦ <b>별하늘</b>의 서재</a><button class="menu-toggle" aria-label="메뉴 열기">☰</button><nav class="nav"><a class="" href="index.html">홈</a><a class="" href="about.html">작가소개</a><a class="" href="works.html">작품소개</a><a class="active" href="guestbook.html">방명록</a></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow-dark">GUESTBOOK</div><h1 class="page-title">방명록</h1><p>당신의 이야기도 이곳에 남겨주세요.</p></div></section><section class="content"><div class="container"><div class="paper"><form class="guest-form" id="guestForm"><div class="field"><label for="guestName">이름</label><input id="guestName" name="name" placeholder="이름 또는 별명을 입력하세요" maxlength="30" required></div><div class="field"><label for="guestMessage">메시지</label><textarea id="guestMessage" name="message" placeholder="작가에게 전하고 싶은 말을 남겨주세요." maxlength="500" required></textarea></div><button class="submit" type="submit">방명록 남기기 ✧</button><p id="notice" aria-live="polite" style="font-size:12px;margin:0;color:#747795">작성한 메시지는 현재 브라우저에만 저장됩니다.</p></form><div class="entries" id="entries"><h2 style="font:700 21px 'Gowun Batang',serif">남겨주신 이야기</h2></div></div></div></section></main>
<script>
(function(){
 const key='byeolhaneul_guestbook_v1',form=document.getElementById('guestForm'),list=document.getElementById('entries');
 function render(){list.querySelectorAll('.entry').forEach(e=>e.remove());let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
 items.forEach(item=>{const row=document.createElement('article');row.className='entry';const name=document.createElement('strong');name.textContent=item.name;const time=document.createElement('time');time.textContent=item.date;const msg=document.createElement('p');msg.textContent=item.message;row.append(name,time,msg);list.append(row)});
 if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.style.color='#898ba1';empty.style.fontSize='13px';empty.textContent='첫 번째 메시지를 남겨보세요.';list.append(empty)}
 }
 form.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(form),item={name:String(data.get('name')).trim(),message:String(data.get('message')).trim(),date:new Date().toLocaleString('ko-KR')};if(!item.name||!item.message)return;let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}items.unshift(item);localStorage.setItem(key,JSON.stringify(items.slice(0,50)));form.reset();document.getElementById('notice').textContent='메시지를 남겨주셔서 감사합니다!';render()});
 render();
})();
</script><footer class="site-footer"><div class="container footer-inner"><div class="footer-brand">별하늘의 서재 ✧</div><span>상상하는 모든 순간, 그곳에 판타지가 있습니다.</span><span>© 2026 BYEOLHANEUL. ALL RIGHTS RESERVED.</span></div></footer><script src="script.js"></script></body></html>
